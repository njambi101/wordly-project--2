<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <style>
        body{
            background-color: black;
            color: white;
            font-size: large;
            font-weight: bold;
            
        }
        .images-icon{
            height: 50px;
            border: solid;
            border-color: white;
            border-radius: 25px;
            
        }
        .images{
            background-color: black;
            border-color: white;
            border: solid;          
            border-radius: 20px;
            padding: 10px 10px;
        }
    </style>
</head>

<body>
    <p>Rock Paper Scissors</p>
    <button onclick="
      playGame('rock');
    " class="images"><img src="images/rock-image.png" class="images-icon"></button>

    <button onclick="
      playGame('paper');
    " class="images"><img src="images/paper-image.jpg" class="images-icon"></button>

    <button onclick="
      playGame('scissors');
    " class="images"><img src="images/scissors-image.jpg" class="images-icon"></button>
    
    <p class="js-result"></p>

    <p class="js-moves"></p>

    <p class="js-scores"></p>


    <button onclick="
    score.wins = 0,
    score.losses = 0,
    score.ties = 0
    localStorage.removeItem('score');
    buttons();
    ">Reset scores</button>

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };

      /*  document.querySelector('.js-scores')
        .innerHTML = `wins: ${score.wins}, losses: ${score.losses}, ties: ${score.ties}`
        */
       buttons();
        //console.log(JSON.parse(localStorage.getItem('score')));
        /*if (!score) {
            score = {
                wins: 0,
                losses: 0,
                ties: 0
            };
        }
            */
        function playGame(playerMove) {
            const computerMove = pickComputerMove();

            let result = '';

            if (playerMove === 'scissors') {
                if (computerMove === 'rock') {
                    result = 'You lose.';
                } else if (computerMove === 'paper') {
                    result = 'You win.';
                } else if (computerMove === 'scissors') {
                    result = 'Tie.';
                }

            } else if (playerMove === 'paper') {
                if (computerMove === 'rock') {
                    result = 'You win.';
                } else if (computerMove === 'paper') {
                    result = 'Tie.';
                } else if (computerMove === 'scissors') {
                    result = 'You lose.';
                }

            } else if (playerMove === 'rock') {
                if (computerMove === 'rock') {
                    result = 'Tie.';
                } else if (computerMove === 'paper') {
                    result = 'You lose.';
                } else if (computerMove === 'scissors') {
                    result = 'You win.';
                }
            }
            
            if(result === 'You win.'){
                score.wins += 1;                 
            }else if (result === 'You lose.'){
                score.losses += 1;
            }else if (result === 'Tie.'){
                score.ties += 1;
            }

         localStorage.setItem('score',JSON.stringify(score));
         document.querySelector('.js-result').innerHTML = result;

         document.querySelector('.js-moves').innerHTML =`you ${playerMove} - ${computerMove} computer`;

         buttons();
        }
            /*document.querySelector('.js-scores')
                .innerHTML = `wins: ${score.wins}, losses: ${score.losses}, ties: ${score.ties}`
*/

            /*alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
 wins: ${score.wins}, losses: ${score.losses}, ties: ${score.ties}`);
        
*/
        function buttons(){
            
            document.querySelector('.js-scores')
                .innerHTML = `wins: ${score.wins}, losses: ${score.losses}, ties: ${score.ties}`;
        }

        function pickComputerMove() {
            const randomNumber = Math.random();

            let computerMove = '';

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper';
            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'scissors';
            }

            return computerMove;
        }
    </script>
</body>

</html>
