<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/this.css">
</head>

<body>
    <p>Rock Paper Scissors</p>
    <button onclick="
      playGame('rock');
    " class="images"><img src="images/rock-emoji.jpg" class="images-icon"></button>

    <button onclick="
      playGame('paper');
    " class="images"><img src="images/paper-emoji.jpg" class="images-icon"></button>

    <button onclick="
      playGame('scissors');
    " class="images"><img src="images/scissors-emoji.jpg" class="images-icon"></button>
    
    <p class="js-result  resulted"></p>

    <p class="js-moves"></p>

    <p class="js-scores  resulted"></p>


    <button onclick="
    score.wins = 0,
    score.losses = 0,
    score.ties = 0
    localStorage.removeItem('score');
    buttons();
    " class="reset-score-button">Reset scores</button>

    <script src="scripts/this.js"></script>
</body>

</html>
