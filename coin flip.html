        function playGame(guess){
           const computerMove = computerguese();

            }else if(guess === 'tails'){

            }

                moves.losses++;
            }
           

             alert(`The computer guessed ${computerMove}. ${result}
Wins: ${moves.wins}, Losses: ${moves.losses}`);

        }
        //console.log(moves);
        function computerguese() {
            const randomNumber = Math.random();
            let computerMove = '';

            if (randomNumber < 0.5) {
                computerMove = 'heads';
            } else {
                computerMove = 'tails';
            }
            return computerMove;
        }
